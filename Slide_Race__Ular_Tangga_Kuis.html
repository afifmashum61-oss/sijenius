<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slide Race: Ular Tangga Kuis</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
#board,.cube,.pawn{will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
html,body{height:100%;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0f1226;color:#fff}
body{display:flex;flex-direction:column;--W:min(78vh,62vw)}
.stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(#3fb4f5,#9bdcff 65%,#e3f6ff);perspective:1100px;perspective-origin:50% 25%;display:flex;align-items:center;justify-content:center}
.rainbow{position:absolute;top:-2vh;left:50%;translate:-50% 0;width:70vh;height:35vh;background:radial-gradient(circle at 50% 100%,transparent 52%,#f44 52%,#f90 57%,#fd0 62%,#4c4 67%,#39f 72%,#93f 77%,transparent 77%);opacity:.85}
.cloud{position:absolute;width:14vh;height:4.5vh;background:#fff;border-radius:5vh;opacity:.9;animation:fl linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:6vh;height:6vh;left:2vh;top:-3vh}.cloud:after{width:7vh;height:7vh;right:2vh;top:-3.5vh}
@keyframes fl{from{left:-20vh}to{left:110%}}
#board{position:relative;width:var(--W);height:var(--W);display:grid;grid-template:repeat(10,1fr)/repeat(10,1fr);transform:rotateX(56deg) translateY(2vh);transform-style:preserve-3d;border:.8vh solid #fff;border-radius:1vh;box-shadow:0 3vh 4vh rgba(0,40,90,.5)}
.cell{display:flex;align-items:center;justify-content:center;flex-direction:column;font:900 calc(var(--W)/19) system-ui;text-shadow:0 .3vh 0 rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.55)}
.k0{background:#2979ff}.k1{background:#7c4dff}.k2{background:#00bcd4}
.cell.g{background:linear-gradient(135deg,#ffe066,#ff9800);font-size:calc(var(--W)/14)}.cell small{font-size:calc(var(--W)/38)}
svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pawn{position:absolute;width:calc(var(--W)/14);height:calc(var(--W)/11);background:var(--c);border:.4vh solid #fff;border-radius:50% 50% 35% 35%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--W)/20);box-shadow:0 .5vh 1vh rgba(0,0,0,.5);transform-origin:50% 100%;transform:rotateX(-56deg);translate:-50% -85%;transition:left .28s,top .28s}
.die{position:absolute;bottom:14vh;width:11vh;height:11vh;perspective:600px;z-index:5}
.die.l{left:5vw}.die.r{right:5vw}
.tl{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(-24deg)}
.cube{width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.2,.8,.3,1)}
.hop{animation:hop 1.2s}@keyframes hop{30%{translate:0 -9vh}60%{translate:0 0}75%{translate:0 -3vh}100%{translate:0 0}}
.f{position:absolute;inset:0;background:#fff;border:.3vh solid #ccd;border-radius:1.4vh;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);padding:1.2vh;backface-visibility:hidden}
.f i{margin:auto;width:2.2vh;height:2.2vh;border-radius:50%}.f i.o{background:#e91e63}
.f1{transform:translateZ(5.5vh)}.f2{transform:rotateY(90deg) translateZ(5.5vh)}.f3{transform:rotateX(-90deg) translateZ(5.5vh)}
.f4{transform:rotateX(90deg) translateZ(5.5vh)}.f5{transform:rotateY(-90deg) translateZ(5.5vh)}.f6{transform:rotateY(180deg) translateZ(5.5vh)}
.banner{position:absolute;top:1.5vh;left:50%;transform:translate(-50%,-250%);z-index:20;padding:1.4vh 3vh;border-radius:5vh;font:900 3vh system-ui;background:linear-gradient(90deg,#ff512f,#f09819);box-shadow:0 1vh 3vh rgba(0,0,0,.4);transition:transform .5s cubic-bezier(.3,1.6,.5,1);text-align:center;max-width:90vw}
.banner.show{transform:translate(-50%,0)}.banner.up{background:linear-gradient(90deg,#11998e,#38ef7d)}.banner.down{background:linear-gradient(90deg,#e53935,#ff7043)}
.top{position:fixed;top:1.2vh;z-index:30;border:0;border-radius:3vh;padding:1vh 2vh;font:700 2vh system-ui;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
#mute{left:1.5vh}#edit{right:1.5vh}
.hud{height:36vh;display:flex;gap:1vh;padding:1vh;background:#111428;border-top:.4vh solid #2b2f5a}
.card{flex:1;min-width:0;background:#1c2040;border:.5vh solid var(--c);border-radius:1.6vh;padding:1.2vh;display:flex;flex-direction:column;gap:.8vh;opacity:.6;transition:flex .4s,opacity .3s}
.card.on{opacity:1;flex:2.6;box-shadow:0 0 3vh var(--c),inset 0 0 2vh rgba(255,255,255,.1);background:#262b5a}
.nm{font:800 2.6vh system-ui;display:flex;align-items:center;gap:1vh}.nm span{background:var(--c);border-radius:50%;width:4vh;height:4vh;display:flex;align-items:center;justify-content:center}
.pos{font:600 2.2vh system-ui;color:#9fd}.pts{font:800 2.6vh system-ui;color:#ffd740}
.roll{margin-top:auto;border:0;border-radius:1.4vh;padding:1.4vh;font:900 2.4vh system-ui;color:#fff;background:linear-gradient(90deg,#ff512f,#f09819,#ffd200);cursor:pointer}
.roll:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.qz{display:none;flex:1;flex-direction:column;gap:.7vh;min-height:0}.card.q .qz{display:flex}.card.q .roll{display:none}
.qz b{color:#ffd740;font:900 2vh system-ui}.qz p{font:700 2.3vh/1.25 system-ui}
.op{display:grid;grid-template-columns:1fr 1fr;gap:.8vh}
.op button{border:0;border-radius:1vh;padding:1vh;font:700 2vh/1.15 system-ui;text-align:left;color:#fff;background:#4a4fb5;cursor:pointer}
.op button:hover:not(:disabled){background:#6a6fe0}.op .ok{background:#2e9e4f!important}.op .no{background:#d32f2f!important}
.ov2{position:fixed;inset:0;z-index:50;background:rgba(10,12,35,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.6vh;text-align:center}
.ov2.h{display:none}.ov2 h1{font:900 6vh system-ui;color:#ffd740}.ov2 input,.ov2 select{padding:1vh 2vh;font:700 2.4vh system-ui;border-radius:1vh;border:0;width:36vh}
.big{border:0;border-radius:2vh;padding:1.6vh 5vh;font:900 3vh system-ui;color:#fff;background:linear-gradient(90deg,#ff512f,#f09819);cursor:pointer}
textarea{width:min(90vw,150vh);height:60vh;font:1.9vh/1.4 monospace;padding:1vh;border-radius:1vh}
#cf{position:fixed;inset:0;z-index:60;pointer-events:none}
.stage{background:radial-gradient(circle at 88% 16%,#fffbe0 0,#ffe45e 3.5vh,rgba(255,228,94,.35) 9vh,transparent 24vh),linear-gradient(#1565c0,#42a5f5 40%,#90d5ff 70%,#e6fbff)}
.stage:before{content:"";position:absolute;left:0;right:0;bottom:0;height:30vh;background:radial-gradient(ellipse 55% 100% at 18% 100%,#1f8f4e 62%,transparent 63%),radial-gradient(ellipse 48% 85% at 80% 100%,#2aa85f 62%,transparent 63%),radial-gradient(ellipse 36% 65% at 50% 100%,#43c377 62%,transparent 63%)}
.sp{position:absolute;font-size:3vh;animation:tw 1.8s infinite alternate}@keyframes tw{to{opacity:.15;transform:scale(1.6) rotate(45deg)}}
.logo{position:absolute;left:1.8vh;top:7.5vh;z-index:6;font:900 4vh/1 system-ui;letter-spacing:.2vh;color:#fff;-webkit-text-stroke:.25vh #5a2fd6;text-shadow:0 .5vh 0 #5a2fd6,0 1vh 2vh rgba(0,0,0,.35);transform:rotate(-4deg)}.logo small{display:block;font-size:2.2vh;color:#ffe45e;-webkit-text-stroke:0;text-shadow:0 .3vh 0 #b45a00}
#board{border:.9vh solid #fff;border-radius:1.4vh;box-shadow:0 1vh 0 #283593,0 2vh 0 #1a237e,0 3vh 0 #0d1250,0 5vh 5vh rgba(0,20,80,.6),0 0 5vh rgba(124,77,255,.8)}
#board:after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.32),transparent 40%,rgba(0,0,0,.12));pointer-events:none}
.cell{box-shadow:inset 0 .4vh .6vh rgba(255,255,255,.45),inset 0 -.5vh .8vh rgba(0,0,0,.28)}
.k0{background:linear-gradient(145deg,#6aa5ff,#1a56d6)}.k1{background:linear-gradient(145deg,#b39cff,#5a2fd6)}.k2{background:linear-gradient(145deg,#5ff3ff,#0390a8)}
.cell.g{animation:gl 1.4s infinite alternate}@keyframes gl{to{box-shadow:inset 0 0 3vh #fff,0 0 3vh #ffd740}}
.pawn{background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.7) 0,transparent 38%),var(--c);border-radius:50% 50% 40% 40%;box-shadow:0 .5vh 1vh rgba(0,0,0,.5),0 0 1.6vh var(--c)}
.pawn.act{animation:bob .6s ease-in-out infinite alternate;z-index:5}@keyframes bob{to{translate:-50% -112%}}
.die{filter:drop-shadow(0 1.5vh 1.2vh rgba(0,0,60,.45))}
.f{background:linear-gradient(145deg,#fff,#d6dbff)}.f i.o{background:radial-gradient(circle at 35% 30%,#ff80ab,#c2185b);box-shadow:inset 0 -.2vh .3vh rgba(0,0,0,.3)}
.banner.show{border:.4vh solid #fff;font-size:3.4vh;text-shadow:0 .3vh 0 rgba(0,0,0,.35)}
.hud{background:linear-gradient(#1a1e4a,#0b0d24);border-top:.5vh solid #7c4dff;box-shadow:0 -1vh 3vh rgba(124,77,255,.45)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),#1c2040;border-width:.4vh;border-radius:2vh}
.card.on{background:linear-gradient(160deg,#3d43a0,#1f2350);animation:pu 1.4s ease-in-out infinite alternate}@keyframes pu{to{box-shadow:0 0 5vh var(--c),inset 0 0 3vh rgba(255,255,255,.2)}}
.bar{height:1vh;background:rgba(255,255,255,.15);border-radius:1vh;overflow:hidden}.bar i{display:block;height:100%;width:1%;background:linear-gradient(90deg,var(--c),#fff);transition:width .5s}
.roll{background:linear-gradient(90deg,#ff512f,#f09819,#ffd200,#f09819,#ff512f);background-size:200% 100%;animation:sh 2s linear infinite;box-shadow:0 .6vh 0 #b45a00,0 1vh 2vh rgba(0,0,0,.4);text-shadow:0 .2vh 0 rgba(0,0,0,.3)}@keyframes sh{to{background-position:200% 0}}
.roll:disabled{animation:none}
.stage:before{display:none}#bgs{position:absolute;inset:0;width:100%;height:100%}.bl{animation:bf 5s ease-in-out infinite alternate}@keyframes bf{to{transform:translateY(-16px)}}#bg{right:17vh}

// ====== DATA PAPAN ======
const L={3:22,8:30,28:56,51:72,71:91,80:99},S={27:5,40:19,54:33,62:18,88:67,95:75};
const COL=['#ff3b30','#ffd60a','#30d158','#ff9f0a'],AV=['🦊','🐼','🐸','🦁'];
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const xy=k=>{const r=(k-1)/10|0,i=(k-1)%10,c=r%2?9-i:i;return[(c+.5)*10,(9-r+.5)*10]};
// ====== SUARA ======
let AC,muted=false;
const ac=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.state=='suspended'&&AC.resume();return AC};
function tone(f,d,ty='sine',v=.15,t=0,f2){if(muted)return;const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,s);f2&&o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d)}
function noise(t,d,v){if(muted)return;const a=ac(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;g.gain.value=v;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t)}
const SFX={dice(){for(let i=0;i<11;i++)noise(i*.1,.06,.5)},step(){tone(520,.08,'square',.07)},ok(){[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.18,i*.1))},bad(){tone(220,.4,'sawtooth',.14,0,80)},up(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.15,'triangle',.16,i*.08))},slide(){tone(1100,.9,'sawtooth',.09,0,150)},win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.2,i*.15))}};
$('#mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇 Senyap':'🔊 Suara'};
// ====== PAPAN ======
const B=$('#board');let h='';
for(let r=9;r>=0;r--)for(let c=0;c<10;c++){const k=r*10+(r%2?9-c:c)+1;h+=`<div class="cell k${(r+c)%3}${k==100?' g':''}">${k==100?'🏆<small>🏁 100</small>':k}</div>`}
let s='';
for(const[a,b]of Object.entries(L)){const[x1,y1]=xy(+a),[x2,y2]=xy(b),dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),px=-dy/l*1.5,py=dx/l*1.5;
s+=`<line x1="${x1+px}" y1="${y1+py}" x2="${x2+px}" y2="${y2+py}" stroke="#6d4c41" stroke-width="1.1" stroke-linecap="round"/><line x1="${x1-px}" y1="${y1-py}" x2="${x2-px}" y2="${y2-py}" stroke="#6d4c41" stroke-width="1.1" stroke-linecap="round"/>`;
for(let t=2.5;t<l-1;t+=3.4){const x=x1+dx*t/l,y=y1+dy*t/l;s+=`<line x1="${x+px}" y1="${y+py}" x2="${x-px}" y2="${y-py}" stroke="#ffcc80" stroke-width=".9" stroke-linecap="round"/>`}}
const SC=['#ff4081','#ffeb3b','#76ff03','#ff6e40','#e040fb','#18ffff'];let si=0;
for(const[a,b]of Object.entries(S)){const[x1,y1]=xy(+a),[x2,y2]=xy(b),dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy);
const cx=Math.max(3,Math.min(97,(x1+x2)/2-dy/l*16)),cy=Math.max(3,Math.min(97,(y1+y2)/2+dx/l*16)),c=SC[si++%6],d=`M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`;
s+=`<path d="${d}" fill="none" stroke="#222" stroke-opacity=".3" stroke-width="3.8" stroke-linecap="round" transform="translate(.5 .8)"/><path d="${d}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width=".9" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="2" fill="${c}" stroke="#fff" stroke-width=".5"/>`}
B.innerHTML=h+`<svg class="ov" viewBox="0 0 100 100">${s}</svg>`;
// ====== DADU ======
const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]},BASE={1:[0,0],2:[0,-90],3:[90,0],4:[-90,0],5:[0,90],6:[0,180]};
const dice=['#dr'].map(q=>{const c=$(q+' .cube');c.innerHTML=[1,2,3,4,5,6].map(v=>`<div class="f f${v}">${[...Array(9)].map((_,i)=>`<i class="${PIP[v].includes(i)?'o':''}"></i>`).join('')}</div>`).join('');return{c,w:$(q),x:0,y:0}});
function rollDice(v){const r=n=>Math.random()*n|0;dice.forEach(d=>{d.x=(Math.floor(d.x/360)+2+r(2))*360+BASE[v][0];d.y=(Math.floor(d.y/360)+2+r(2))*360+BASE[v][1];const tl=d.w.querySelector('.tl'),dv=d.w.querySelector('.dv');dv.classList.remove('on');dv.textContent=v;d.c.style.transform=`rotateX(${d.x}deg) rotateY(${d.y}deg)`;tl.classList.remove('hop','set');d.w.classList.remove('rolling');void d.w.offsetWidth;tl.classList.add('hop');d.w.classList.add('rolling');clearTimeout(d.t);d.t=setTimeout(()=>{dv.classList.add('on');tl.classList.add('set')},1350)})}
// ====== BANNER ======
let bt;function banner(t,ms=2000,cl=''){const b=$('#bn');b.className='banner show '+cl;b.textContent=t;clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('show'),ms)}
// ====== GAME ======
let P=[],turn=0,busy=false,deck=[];
const nextQ=()=>{if(!deck.length){deck=Q.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}}return Q[deck.pop()]};
const place=(p,k)=>{const[x,y]=xy(k);p.pawn.style.left=`calc(${x}% + ${(p.i-1.5)*1.3}vh)`;p.pawn.style.top=y+'%'};
function hud(){P.forEach(p=>{p.el.classList.toggle('on',p.i==turn);p.pawn.classList.toggle('act',p.i==turn);p.el.querySelector('.bar i').style.width=p.pos+'%';p.el.querySelector('.pos').textContent=`Petak #${p.pos}/100`;p.el.querySelector('.pts').textContent=`⭐ ${p.pts} POIN`;p.el.querySelector('.roll').disabled=busy||p.i!=turn})}
function next(){turn=(turn+1)%P.length;busy=false;hud();banner(`Giliran ${P[turn].name}`,1200)}
function begin(){const n=+$('#cnt').value;P=[];turn=0;busy=false;$('#hud').innerHTML='';B.querySelectorAll('.pawn').forEach(e=>e.remove());
for(let i=0;i<n;i++){const name=$('#n'+i).value.trim()||'Siswa '+(i+1),el=document.createElement('div');el.className='card';el.style.setProperty('--c',COL[i]);
el.innerHTML=`<div class="nm"><span>${AV[i]}</span>${esc(name)}</div><div class="pos"></div><div class="bar"><i></i></div><div class="pts"></div><div class="qz"></div><button class="roll">🎲 LEMPAR DADU</button>`;$('#hud').appendChild(el);
const pawn=document.createElement('div');pawn.className='pawn';pawn.style.setProperty('--c',COL[i]);pawn.textContent=AV[i];B.appendChild(pawn);
const p={i,name,pos:1,pts:0,el,pawn};place(p,1);P.push(p);el.querySelector('.roll').onclick=()=>ask(p)}
$('#start').classList.add('h');hud();banner(`Giliran ${P[0].name}`,1500)}
function ask(p){ac();busy=true;hud();const q=nextQ(),z=p.el.querySelector('.qz');
z.innerHTML=`<b>⚡ JAWAB CEPAT</b><p>${esc(q[0])}</p><div class="op">${q[1].map((t,j)=>`<button data-j="${j}">${'ABCD'[j]}. ${esc(t)}</button>`).join('')}</div>`;p.el.classList.add('q');
z.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(p,q,+b.dataset.j,z))}
async function answer(p,q,j,z){z.querySelectorAll('button').forEach((b,k)=>{b.disabled=true;if(k==q[2])b.classList.add('ok');else if(k==j)b.classList.add('no')});
const ok=j==q[2];if(ok){SFX.ok();p.pts+=50;hud();banner('✅ BENAR! +50 poin',1400)}else{SFX.bad();banner('❌ SALAH! Giliran berpindah',1400)}
await sleep(1600);p.el.classList.remove('q');z.innerHTML='';ok?move(p):next()}
async function move(p){const v=1+Math.random()*6|0;SFX.dice();rollDice(v);await sleep(1400);banner(`🎲 ${p.name} dapat angka ${v}`,1000);await sleep(800);
if(p.pos+v>100){banner('Butuh angka pas menuju Petak 100!',1500);await sleep(1700);return next()}
for(let k=0;k<v;k++){p.pos++;place(p,p.pos);SFX.step();hud();await sleep(330)}
await sleep(300);const t=L[p.pos]||S[p.pos];
if(t){const up=!!L[p.pos],f=p.pos;banner(up?`YEAY! NAIK TANGGA! ${p.name} naik dari Petak ${f} ke Petak ${t}`:`WUUSSH! PEROSOTAN! ${p.name} meluncur dari Petak ${f} ke Petak ${t}`,3000,up?'up':'down');
up?SFX.up():SFX.slide();await sleep(900);p.pawn.style.transition='left 1.2s ease-in-out,top 1.2s ease-in-out';p.pos=t;place(p,t);hud();await sleep(1500);p.pawn.style.transition=''}
if(p.pos==100)return win(p);next()}
// ====== MENANG + CONFETTI ======
function win(p){SFX.win();$('#wt').textContent=`🏆 ${p.name} MENANG! 🎉 (${p.pts} poin)`;$('#win').classList.remove('h');confetti();try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'GAME_SCORE',game:'slide_race',score:p.pts,winner:p.name},'*');}}catch(e){}}
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const a=[...Array(180)].map(()=>({x:Math.random()*c.width,y:-Math.random()*c.height,vx:Math.random()*4-2,vy:2+Math.random()*5,r:Math.random()*6.3,c:`hsl(${Math.random()*360},90%,60%)`}));
(function f(){x.clearRect(0,0,c.width,c.height);let on=0;a.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.r+=.15;if(q.y<c.height+20)on=1;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-5,-3,10,6);x.restore()});if($('#win').classList.contains('h'))return x.clearRect(0,0,c.width,c.height);on?requestAnimationFrame(f):0})()}
$('#again').onclick=()=>{$('#win').classList.add('h');$('#start').classList.remove('h')};
// ====== MENU AWAL & EDIT SOAL ======
const draw=()=>{const n=+$('#cnt').value;$('#names').innerHTML=[0,1,2,3].map(i=>`<div style="margin:.6vh;${i>=n?'display:none':''}">${AV[i]} <input id="n${i}" placeholder="Siswa ${i+1}" maxlength="18"></div>`).join('')};
$('#cnt').onchange=draw;draw();$('#go').onclick=()=>{ac();begin()};
$('#edit').onclick=()=>{$('#ta').value=Q.map(q=>[q[0],...q[1],'ABCD'[q[2]]].join(' | ')).join('\n');$('#ed').classList.remove('h')};
$('#cl').onclick=()=>$('#ed').classList.add('h');
$('#bg').onclick=()=>$('#bgf').click();
$('#bgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bgs').style.display='none';const s=$('#stage').style;s.backgroundImage=`url(${r.result})`;s.backgroundSize='cover';s.backgroundPosition='center'};r.readAsDataURL(f)};
$('#sv').onclick=()=>{const n=$('#ta').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.length>=6&&'ABCD'.includes(a[5].toUpperCase())&&a[5]).map(a=>[a[0],a.slice(1,5),'ABCD'.indexOf(a[5].toUpperCase())]);
if(!n.length)return alert('Format soal belum benar. Contoh: Pertanyaan | A | B | C | D | B');Q=n;deck=[];$('#ed').classList.add('h');banner(`${n.length} soal tersimpan`,1500)};
window.addEventListener('message',e=>{if(e.data==='pauseMusic'||e.data==='pauseAudio'){muted=true;if(AC&&typeof AC.suspend==='function')AC.suspend();}else if(e.data==='resumeMusic'||e.data==='resumeAudio'){muted=false;if(AC&&typeof AC.resume==='function')AC.resume();}});
</script></body></html>
